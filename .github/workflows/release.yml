name: macOS release

on:
  workflow_call:
    inputs:
      name:
        description: App display name — the release title and the zip prefix (MonoText → MonoText-1.2.3.zip)
        required: true
        type: string
      app:
        description: Path to the built .app, relative to the repo root
        required: true
        type: string
      cask:
        description: Cask file name in gustaferiksson/homebrew-tap/Casks, without .rb
        required: true
        type: string
      runner:
        description: Runner image label, e.g. macos-26
        required: true
        type: string
      build:
        description: Shell script that produces `app`. $VERSION and $BUILD are set; $SIGN_ID holds the imported Developer ID identity.
        required: true
        type: string
      signed_by_build:
        description: Set when `build` already signs the app (Xcode projects with nested signed targets), to skip the codesign step
        required: false
        default: false
        type: boolean
      cache_paths:
        description: Paths to restore with actions/cache before `build` (newline-separated); empty skips the restore
        required: false
        default: ''
        type: string
      cache_key:
        description: Exact cache key to restore, e.g. xcode-release-mac-<sha> saved by the caller's main branch
        required: false
        default: ''
        type: string
      cache_restore_keys:
        description: Fallback key prefixes when `cache_key` misses (newline-separated)
        required: false
        default: ''
        type: string
    secrets:
      APPLE_CERT_P12:
        description: base64 of the exported "Developer ID Application" cert (.p12)
        required: true
      APPLE_CERT_PASSWORD:
        description: password used when exporting that .p12
        required: true
      NOTARY_APPLE_ID:
        description: Apple ID email for notarytool
        required: true
      NOTARY_PASSWORD:
        description: app-specific password for that Apple ID
        required: true
      TAP_GITHUB_TOKEN:
        description: token with write access to gustaferiksson/homebrew-tap
        required: true

jobs:
  release:
    name: Build & release
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # the tag-on-main guard needs history

      - name: Preflight — every release secret is set
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for name in APPLE_CERT_P12 APPLE_CERT_PASSWORD NOTARY_APPLE_ID NOTARY_PASSWORD TAP_GITHUB_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret $name is empty — refusing to release"
              exit 1
            fi
          done

      - name: Require the tag to be on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main — refusing to release"
            exit 1
          fi

      - name: Resolve version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          ID="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -F '"' '/Developer ID Application/{print $2; exit}')"
          if [ -z "$ID" ]; then
            echo "::error::no Developer ID Application identity in the imported keychain"
            exit 1
          fi
          echo "Imported: $ID"
          echo "SIGN_ID=$ID" >> "$GITHUB_ENV"

      - name: Restore the build cache
        if: ${{ inputs.cache_paths != '' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache_paths }}
          key: ${{ inputs.cache_key }}
          restore-keys: ${{ inputs.cache_restore_keys }}

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          ${{ inputs.build }}

      - name: Sign
        if: ${{ !inputs.signed_by_build }}
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp --sign "$SIGN_ID" "$APP"

      - name: Notarize & staple
        env:
          APP: ${{ inputs.app }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: "82K3YC8HVF"
        run: |
          set -euo pipefail
          /usr/bin/ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "$APP"

      - name: Package the stapled app
        id: pkg
        env:
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ZIP="${{ inputs.name }}-$VERSION.zip"
          /usr/bin/ditto -c -k --keepParent "$APP" "$ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ZIP" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Verify the app is signed, notarized and stapled
        env:
          APP: ${{ inputs.app }}
        run: |
          set -euo pipefail
          codesign --verify --strict --verbose=2 "$APP"
          codesign -dvv "$APP" > "$RUNNER_TEMP/codesign.txt" 2>&1
          grep -q 'Authority=Developer ID Application' "$RUNNER_TEMP/codesign.txt"
          # No spctl here: GitHub runners disable Gatekeeper assessments, so
          # spctl rejects even notarized artifacts. stapler validate is the
          # offline notarization-ticket proof.
          xcrun stapler validate "$APP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.pkg.outputs.zip }}" \
            --title "${{ inputs.name }} ${{ steps.ver.outputs.version }}" \
            --generate-notes

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          CASK: ${{ inputs.cask }}
          VERSION: ${{ steps.ver.outputs.version }}
          SHA256: ${{ steps.pkg.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/gustaferiksson/homebrew-tap.git" tap
          cd tap
          sed -i '' -E "s/^  version \".*\"/  version \"$VERSION\"/" "Casks/$CASK.rb"
          sed -i '' -E "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" "Casks/$CASK.rb"
          grep -q "^  version \"$VERSION\"$" "Casks/$CASK.rb"
          grep -q "^  sha256 \"$SHA256\"$" "Casks/$CASK.rb"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "$CASK $VERSION"
          git push
